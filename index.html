<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tanveer Hussain - Web Platform</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>

  <nav class="navbar">
    <a href="./index.html" class="logo">Tanveer<span>Hussain</span></a>
    <div class="nav-links">
      <button class="btn-theme" id="theme-toggle">🌙 / ☀️</button>
      <a href="./index.html">Home</a>
      <a href="./admin.html">Admin Portal</a>
    </div>
  </nav>

  <header class="hero">
    <h1>Insights & Updates</h1>
    <div class="search-box">
      <input type="text" id="search-input" placeholder="Search posts by title or tag...">
    </div>
  </header>

  <main class="container">
    <div id="posts-container" class="grid">
      <p style="text-align: center; color: var(--text-muted);">Loading content...</p>
    </div>
  </main>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
