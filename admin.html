<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal - Dashboard</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>

  <nav class="navbar">
    <a href="./index.html" class="logo">Admin<span>Portal</span></a>
    <div class="nav-links">
      <a href="./index.html">View Main Site</a>
      <a href="#" id="logout-btn" class="hidden">Logout</a>
    </div>
  </nav>

  <main class="container" style="margin-top: 2rem;">
    <!-- Login Panel -->
    <div id="login-card" class="card" style="max-width: 420px; margin: 3rem auto;">
      <h2 style="margin-bottom: 1.5rem; text-align: center;">Portal Access</h2>
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="username" placeholder="Admin">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••">
      </div>
      <button id="login-btn">Authenticate</button>
    </div>

    <!-- Admin Control Center -->
    <div id="dashboard" class="hidden">
      <section class="card" style="margin-bottom: 2rem;">
        <h2>Create Article with Media</h2>
        <br>
        <div class="form-group">
          <label>Title</label>
          <input type="text" id="post-title" placeholder="Title...">
        </div>
        <div class="form-group">
          <label>Category</label>
          <select id="post-category">
            <option value="Tech">Tech</option>
            <option value="Updates">Updates</option>
            <option value="Life">Life</option>
          </select>
        </div>
        <div class="form-group">
          <label>Upload Image (Optional)</label>
          <input type="file" id="post-image" accept="image/*">
        </div>
        <div class="form-group">
          <label>Content</label>
          <textarea id="post-content" rows="6" placeholder="Write article content..."></textarea>
        </div>
        <button id="publish-btn">Publish Post</button>
      </section>

      <h2>Manage Content</h2>
      <div id="admin-posts" class="grid" style="margin-top: 1rem;"></div>
    </div>
  </main>

  <script type="module" src="./js/admin.js"></script>
</body>
</html>
